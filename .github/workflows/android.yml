name: Android ARM64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check lighting regressions
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/lighting_model_test.c -lm -o /tmp/lighting-test
          /tmp/lighting-test
          cc -D__ANDROID__ -std=c11 -Wall -Wextra -Werror tests/occlusion_cache_test.c tefkernel/tef_api_imp.c -lm -o /tmp/occlusion-test
          /tmp/occlusion-test
          cc -D_GNU_SOURCE -D__ANDROID__ -std=c11 -Wall -Wextra -Werror -Ixdl/include -ffunction-sections -fdata-sections tests/world_batch_test.c tefkernel/tef_api_imp.c -Wl,--gc-sections -lm -ldl -o /tmp/batch-test
          /tmp/batch-test
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' > /dev/null
      - name: Configure ARM64
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Verify loader ABI exports
        run: python3 tests/check_android_abi.py build/libLightsAndShadows.so
      - name: Package installable mod and sources
        run: |
          mkdir -p Package/Resources/lib dist
          cp build/libLightsAndShadows.so Package/Resources/lib/libLightsAndShadows.android.arm64.so
          (cd Package && zip -r ../dist/LightsAndShadows-1.1.3-Android-arm64.zip .)
          git archive --format=zip -o dist/LightsAndShadows-1.1.3-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LightsAndShadows-1.1.3
          path: dist/*.zip
          if-no-files-found: error
